  tailwind.config = { darkMode: "class" };
  (function () {
    var stored = localStorage.getItem("apilayer-theme");
    var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var isDark = theme === "dark";
    document.documentElement.classList.toggle("dark", isDark);
    var meta = document.getElementById("themeColorMeta");
    if (meta) meta.content = isDark ? "#171717" : "#ffffff";

<script>
const KeyEncryptor = (function () {
    'use strict';

    function _arrayBufferToBase64(buffer) {
        var bytes = new Uint8Array(buffer);
        var binary = '';
        for (var i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
    }

    function _base64ToArrayBuffer(base64) {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
    }

    async function _deriveKey(password, salt) {
        var enc = new TextEncoder();
        var keyMaterial = await crypto.subtle.importKey(
            'raw',
            enc.encode(password),
            'PBKDF2',
            false,
            ['deriveKey']
        );
        return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: 600000, hash: 'SHA-256' },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
        );
    }

    async function encrypt(plaintext, password) {
        if (!plaintext || !password) throw new Error('Plaintext and password are required.');
        var salt = crypto.getRandomValues(new Uint8Array(16));
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var key = await _deriveKey(password, salt);
        var encoded = new TextEncoder().encode(plaintext);
        var cipherBuffer = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, encoded);
        return {
            iv: _arrayBufferToBase64(iv),
            salt: _arrayBufferToBase64(salt),
            ciphertext: _arrayBufferToBase64(cipherBuffer)
        };
    }

    async function decrypt(bundle, password) {
        if (!bundle || !password) throw new Error('Bundle and password are required.');
        var iv = new Uint8Array(_base64ToArrayBuffer(bundle.iv));
        var salt = new Uint8Array(_base64ToArrayBuffer(bundle.salt));
        var cipherBuffer = _base64ToArrayBuffer(bundle.ciphertext);
        var key = await _deriveKey(password, salt);
        var decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, cipherBuffer);
        return new TextDecoder().decode(decrypted);
    }

    return { encrypt, decrypt };
})();
window.KeyEncryptor = KeyEncryptor;
</script>

const state = { results: new Map() };
const $ = id => document.getElementById(id);

function groupByApi() {
  const groups = {};
  for (const t of TESTS) {
    if (!groups[t.id]) groups[t.id] = { api: t.api, tests: [] };
    groups[t.id].tests.push(t);
  }
  return groups;
}

function buildRow(test, index) {
  const row = document.createElement("div");
  row.className = "border-b border-gray-200 dark:border-neutral-800 last:border-b-0";
  row.dataset.idx = index;

  const line = document.createElement("div");
  line.className = "flex items-center gap-2 px-2 py-1.5";

  const runBtn = document.createElement("button");
  runBtn.type = "button";
  runBtn.className = "shrink-0 w-7 h-7 inline-flex items-center justify-center rounded-md border border-gray-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 hover:bg-blue-50 dark:hover:bg-neutral-700 text-blue-600 dark:text-blue-400 transition-colors disabled:opacity-50";
  runBtn.innerHTML = '<i class="fa-solid fa-play text-[10px]"></i>';
  runBtn.title = "Run this test";

  const meta = document.createElement("div");
  meta.className = "flex-1 min-w-0";
  meta.innerHTML = `
    <div class="font-mono text-[11px] text-gray-800 dark:text-neutral-200 truncate">${test.name}</div>
    <a href="${test.url}" target="_blank" rel="noopener" class="font-mono text-[10px] text-gray-500 dark:text-neutral-400 hover:underline truncate block">${test.url}</a>
  `;

  const chip = document.createElement("button");
  chip.type = "button";
  chip.className = "chip chip-idle shrink-0";
  chip.dataset.state = "idle";
  chip.innerHTML = '<i class="fa-solid fa-circle-dot"></i> idle';
  chip.title = "Click to toggle response";

  line.append(runBtn, meta, chip);

  const resp = document.createElement("pre");
  resp.className = "hidden mx-2 mb-2 p-2 rounded-md bg-gray-50 dark:bg-neutral-900/60 border border-gray-200 dark:border-neutral-800 text-[10px] font-mono whitespace-pre-wrap break-words text-gray-700 dark:text-neutral-300 max-h-64 overflow-auto";
  resp.textContent = "";

  row.append(line, resp);

  runBtn.addEventListener("click", () => runOne(test, index));
  chip.addEventListener("click", () => toggleResponse(index));

  return row;
}

function buildSections() {
  const container = $("sections");
  container.innerHTML = "";
  const groups = groupByApi();
  let globalIdx = 0;

  for (const id of Object.keys(groups)) {
    const g = groups[id];
    const section = document.createElement("section");
    section.className = "rounded-lg border border-gray-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 overflow-hidden";

    const head = document.createElement("div");
    head.className = "px-2.5 py-1.5 border-b border-gray-200 dark:border-neutral-800 flex items-center gap-1.5";
    head.innerHTML = `
      <i class="fa-solid fa-cube text-[10px] text-blue-500"></i>
      <span class="text-[11px] font-semibold">${g.api}</span>
      <span class="text-[10px] text-gray-500 dark:text-neutral-400">${g.tests.length} endpoint${g.tests.length > 1 ? "s" : ""}</span>
      <button type="button" data-run-group="${id}" class="ml-auto inline-flex items-center gap-1 px-2 py-0.5 rounded-md border border-gray-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 hover:bg-gray-50 dark:hover:bg-neutral-700 text-[10px] font-medium">
        <i class="fa-solid fa-play text-[9px]"></i> Run all
      </button>
    `;

    const rows = document.createElement("div");
    for (const t of g.tests) {
      rows.appendChild(buildRow(t, globalIdx));
      globalIdx++;
    }

    section.append(head, rows);
    container.appendChild(section);

    head.querySelector(`[data-run-group="${id}"]`).addEventListener("click", () => runGroup(id));
  }

  updateSummary();
}

function getRow(idx) {
  return document.querySelector(`.border-b[data-idx="${idx}"]`);
}

function setChip(idx, stateName, label) {
  const row = getRow(idx);
  if (!row) return;
  const chip = row.querySelector(".chip");
  chip.className = `chip chip-${stateName} shrink-0`;
  chip.dataset.state = stateName;
  chip.innerHTML = label;
}

function setResponse(idx, body) {
  const row = getRow(idx);
  if (!row) return;
  row.querySelector("pre").textContent = body;
}

function toggleResponse(idx) {
  const row = getRow(idx);
  if (!row) return;
  const pre = row.querySelector("pre");
  if (!pre.textContent) return;
  pre.classList.toggle("hidden");
}

async function runOne(test, idx, _isRetry) {
  setChip(idx, "loading", '<i class="fa-solid fa-spinner fa-spin"></i> …');
  state.results.set(idx, { state: "loading" });
  updateSummary();

  const t0 = performance.now();
  try {
    const key = sessionStorage.getItem("apilayer-key") || "";
    const res = await fetch(test.url, {
      headers: {
        Accept: "*/*",
        Authorization: key ? `Bearer ${key}` : "",
      },
    });

    const ms = Math.round(performance.now() - t0);
    const text = await res.text();
    const cache = res.headers.get("X-Cache") || "—";
    let display = text;
    if (/json/i.test(res.headers.get("content-type") || "")) {
      try { display = JSON.stringify(JSON.parse(text), null, 2); } catch {}
    }

    const ok = res.ok;
    setResponse(idx, display);
    setChip(idx, ok ? "ok" : "fail",
      `<i class="fa-solid ${ok ? "fa-circle-check" : "fa-circle-xmark"}"></i> ${res.status} · ${ms}ms · ${cache}`);

    state.results.set(idx, { state: ok ? "ok" : "fail", ms, status: res.status, cache });
  } catch (e) {
    const ms = Math.round(performance.now() - t0);
    if (!_isRetry) {
      setChip(idx, "loading", '<i class="fa-solid fa-rotate"></i> retry…');
      await new Promise(r => setTimeout(r, 1500));
      return runOne(test, idx, true);
    }
    setResponse(idx, String(e));
    setChip(idx, "fail", `<i class="fa-solid fa-circle-xmark"></i> ERR · ${ms}ms`);
    state.results.set(idx, { state: "fail", ms, status: "ERR" });
  }
  updateSummary();
}

async function runGroup(apiId) {
  const indices = TESTS.map((t, i) => ({ t, i })).filter(x => x.t.id === apiId);
  for (const { t, i } of indices) {
    await runOne(t, i);
  }
}

async function runAll() {
  const btn = $("runAll");
  btn.disabled = true;
  const t0 = performance.now();
  for (let i = 0; i < TESTS.length; i++) {
    await runOne(TESTS[i], i);
  }
  const total = Math.round(performance.now() - t0);
  $("sumTime").textContent = `total ${total}ms`;
  btn.disabled = false;
}

function collapseAll() {
  document.querySelectorAll("#sections pre").forEach(p => p.classList.add("hidden"));
}

function updateSummary() {
  let ok = 0, fail = 0, idle = 0;
  for (let i = 0; i < TESTS.length; i++) {
    const r = state.results.get(i);
    if (!r || r.state === "idle") idle++;
    else if (r.state === "loading") idle++;
    else if (r.state === "ok") ok++;
    else if (r.state === "fail") fail++;
  }
  $("sumTotal").textContent = `${TESTS.length} tests`;
  $("sumOk").innerHTML = `<i class="fa-solid fa-circle-check"></i> ${ok} ok`;
  $("sumFail").innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${fail} fail`;
  $("sumIdle").innerHTML = `<i class="fa-solid fa-hourglass"></i> ${idle} idle`;
}

/* Theme toggle */
const THEME_KEY = "apilayer-theme";
const themeBtn = document.getElementById("themeToggle");
const metaColor = document.getElementById("themeColorMeta");

function applyTheme(theme, persist) {
  const isDark = theme === "dark";
  document.documentElement.classList.toggle("dark", isDark);
  themeBtn.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
  if (metaColor) metaColor.content = isDark ? "#171717" : "#ffffff";
  if (persist) localStorage.setItem(THEME_KEY, theme);
}
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
  applyTheme(next, true);
});
applyTheme(document.documentElement.classList.contains("dark") ? "dark" : "light", false);

/* ── Key bar ── */
const KEY_STORE = "apilayer-key";
const keyInput = document.getElementById("apiKeyInput");
const saveKeyBtn = document.getElementById("saveKeyBtn");
const authStatus = document.getElementById("authStatus");

function refreshAuthStatus() {
  const has = !!sessionStorage.getItem(KEY_STORE);
  authStatus.textContent = has ? "saved ✓" : "not set";
  authStatus.className = "shrink-0 text-[10px] font-semibold " +
    (has ? "text-emerald-600 dark:text-emerald-400" : "text-gray-500 dark:text-neutral-400");
}

saveKeyBtn.addEventListener("click", () => {
  const k = keyInput.value.trim();
  if (!k) return;
  sessionStorage.setItem(KEY_STORE, k);
  keyInput.value = "";
  refreshAuthStatus();
});

keyInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") saveKeyBtn.click();
});

keyInput.value = sessionStorage.getItem(KEY_STORE) || "";
refreshAuthStatus();

/* Wiring */
$("runAll").addEventListener("click", runAll);
$("collapseAll").addEventListener("click", collapseAll);

buildSections();
</script>
