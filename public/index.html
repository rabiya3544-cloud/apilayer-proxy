<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>apilayer Proxy Playground</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="themeColorMeta">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<script>
  tailwind.config = { darkMode: "class" };
  (function () {
    var stored = localStorage.getItem("apilayer-theme");
    var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var isDark = theme === "dark";
    document.documentElement.classList.toggle("dark", isDark);
    document.documentElement.dataset.theme = theme;
    var meta = document.getElementById("themeColorMeta");
    if (meta) meta.content = isDark ? "#171717" : "#ffffff";
  })();
</script>
<style>
  html { -webkit-text-size-adjust: 100%; color-scheme: light; }
  html.dark { color-scheme: dark; }
  body { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(120,120,140,.35); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(120,120,140,.55); }
  select { -webkit-appearance: none; appearance: none; background-image: none; }
  input[type=date] { min-width: 0; max-width: 100%; -webkit-appearance: none; appearance: none; }
  input[type=date]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: .6; }
  input[type=date]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
  /* Icon swap via CSS — no JS needed */
  #themeToggle .icon-sun { display: none; }
  #themeToggle .icon-moon { display: inline-block; }
  html.dark #themeToggle .icon-sun { display: inline-block; }
  html.dark #themeToggle .icon-moon { display: none; }
</style>
</head>
<body class="h-dvh flex flex-col overflow-hidden bg-gray-50 dark:bg-neutral-950 text-gray-900 dark:text-neutral-100 antialiased text-[13px]">

<header class="shrink-0 z-20 border-b border-gray-200 dark:border-neutral-800 bg-white/95 dark:bg-neutral-900/95 backdrop-blur-md">
  <div class="mx-auto max-w-7xl px-2.5 py-1.5 flex items-center gap-1.5 flex-wrap">
    <div class="order-1 flex items-center gap-1.5 shrink-0">
      <i class="fa-solid fa-bolt text-blue-500 text-[11px]"></i>
      <span class="text-[12px] font-semibold tracking-tight">apilayer proxy</span>

    <button id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme"
      class="order-2 sm:order-3 ml-auto shrink-0 inline-flex items-center justify-center w-7 h-7 rounded-md border border-gray-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 hover:bg-gray-50 dark:hover:bg-neutral-700 text-gray-600 dark:text-neutral-300 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500/40">
      <i class="fa-solid fa-moon text-[11px] icon-moon"></i>
      <i class="fa-solid fa-sun text-[11px] icon-sun"></i>
    </button>

    <div class="order-3 sm:order-2 w-full sm:w-auto sm:flex-1 sm:max-w-lg grid grid-cols-2 gap-1.5">
      <label class="flex flex-col gap-0.5 min-w-0">
        <span class="text-[9px] uppercase tracking-wider font-semibold text-gray-700 dark:text-neutral-400">API</span>
        <select id="apiSelect" class="w-full px-2 py-1 rounded-md border border-gray-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-[12px] focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500"></select>
      </label>
      <label class="flex flex-col gap-0.5 min-w-0">
        <span class="text-[9px] uppercase tracking-wider font-semibold text-gray-700 dark:text-neutral-400">Endpoint</span>

      </label>
    </div>
  </div>
</header>

<main class="flex-1 min-h-0 overflow-y-auto lg:overflow-hidden p-2 grid grid-cols-1 gap-2 content-start lg:content-stretch lg:grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)] lg:grid-rows-1 lg:p-3">

  <section class="flex flex-col rounded-lg border border-gray-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 overflow-hidden lg:min-h-0">
    <div class="px-2.5 py-1.5 border-b border-gray-200 dark:border-neutral-800 flex items-center gap-1.5 shrink-0">
      <i class="fa-solid fa-sliders text-[10px] text-gray-400 dark:text-neutral-500"></i>
      <span class="text-[10px] uppercase tracking-wider font-semibold text-gray-700 dark:text-neutral-400">Parameters</span>
    </div>
    <div id="form" class="p-2 space-y-2 overflow-y-auto overflow-x-hidden grow min-h-0"></div>
    <div class="px-2 py-1.5 border-t border-gray-200 dark:border-neutral-800 flex gap-1.5 shrink-0">
      <button id="run" class="flex-1 inline-flex items-center justify-center gap-1.5 px-2 py-1.5 rounded-md bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-[12px] font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="fa-solid fa-play text-[10px]"></i> Run
      </button>
      <button id="reset" class="inline-flex items-center justify-center gap-1.5 px-2 py-1.5 rounded-md border border-gray-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 hover:bg-gray-50 dark:hover:bg-neutral-700 text-[12px] font-medium transition-colors">
        <i class="fa-solid fa-rotate-left text-[10px]"></i> Reset
      </button>
    </div>
  </section>

  <section class="flex flex-col rounded-lg border border-gray-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 overflow-hidden lg:min-h-0">
    <div class="px-2.5 py-1.5 border-b border-gray-200 dark:border-neutral-800 shrink-0">
      <code id="urlPreview" class="text-[11px] font-mono text-gray-600 dark:text-neutral-400 break-all leading-snug">—</code>
    </div>
    <div class="px-2.5 py-1 border-b border-gray-200 dark:border-neutral-800 flex items-center gap-3 text-[11px] flex-wrap shrink-0">
      <span id="status" class="font-semibold text-gray-700 dark:text-neutral-400">—</span>
      <span id="time" class="text-gray-700 dark:text-neutral-400"><i class="fa-regular fa-clock mr-1 text-[10px]"></i>—</span>
      <span id="size" class="text-gray-700 dark:text-neutral-400"><i class="fa-solid fa-database mr-1 text-[10px]"></i>—</span>
      <span id="cache" class="text-gray-700 dark:text-neutral-400"><i class="fa-solid fa-bolt mr-1 text-[10px]"></i>—</span>
    </div>
    <pre id="response" class="flex-1 min-h-[120px] lg:min-h-0 overflow-auto p-2.5 m-0 font-mono text-[11px] leading-relaxed whitespace-pre-wrap break-words text-gray-800 dark:text-neutral-200">Run a query to see the response.</pre>
  </section>
</main>

<footer class="shrink-0 border-t border-gray-200 dark:border-neutral-800 bg-white dark:bg-neutral-900">
  <div class="mx-auto max-w-7xl px-2.5 py-1.5 flex items-center justify-between gap-2 text-[10px] text-gray-700 dark:text-neutral-400">
    <span><i class="fa-solid fa-code mr-1"></i>apilayer proxy</span>
    <span class="flex items-center gap-2.5">
      <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved text-blue-500"></i> CORS</span>
      <span class="flex items-center gap-1"><i class="fa-solid fa-bolt text-amber-500"></i> Cached</span>
      <span class="flex items-center gap-1"><i class="fa-solid fa-circle-half-stroke text-purple-500"></i> Theme</span>
    </span>
  </div>

          { title: "Options", fields: [
            { name:"limit",  label:"limit",  type:"number", default:10, min:1, max:100 },
            { name:"output", label:"output", type:"select", values:["json"], default:"json" },
          ]},
        ]},
    ],
  },
};

const API_ORDER = [
  "aviationstack","countrylayer","ipstack","mailboxlayer","marketstack",
  "mediastack","numverify","positionstack","scrapestack","serpstack",
];

let currentApi = "serpstack";
let currentEndpoint = "search";

const $ = id => document.getElementById(id);
const form = $("form");
const apiSelect = $("apiSelect");
const endpointSelect = $("endpointSelect");
const runBtn = $("run");
const resetBtn = $("reset");
const urlPreview = $("urlPreview");
const statusEl = $("status");
const timeEl = $("time");
const sizeEl = $("size");
const cacheEl = $("cache");
const responseEl = $("response");

const getApiCfg = () => APIS[currentApi];
const getEndpointCfg = () =>
  (getApiCfg().endpoints || []).find(e => e.id === currentEndpoint) || getApiCfg().endpoints[0];

const INPUT_CLS = "w-full min-w-0 max-w-full px-2 py-1 rounded-md border border-gray-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-[12px] text-gray-900 dark:text-neutral-100 placeholder-gray-400 dark:placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 transition-shadow";
const LABEL_CLS = "text-[10px] uppercase tracking-wider font-semibold text-gray-700 dark:text-neutral-400";
const HINT_CLS = "text-[10px] text-gray-700 dark:text-neutral-500 leading-tight";

function populateApiSelect() {
  apiSelect.innerHTML = "";
  for (const key of API_ORDER) {
    const cfg = APIS[key];
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = cfg.configured ? cfg.label : `${cfg.label} (not configured)`;
    if (!cfg.configured) opt.disabled = true;
    if (key === currentApi) opt.selected = true;
    apiSelect.appendChild(opt);
  }
}

function populateEndpointSelect() {
  const cfg = getApiCfg();
  endpointSelect.innerHTML = "";
  for (const ep of cfg.endpoints || []) {
    const opt = document.createElement("option");
    opt.value = ep.id; opt.textContent = ep.label;
    if (ep.id === currentEndpoint) opt.selected = true;
    endpointSelect.appendChild(opt);
  }
  endpointSelect.disabled = (cfg.endpoints || []).length <= 1;
}

function buildField(f) {
  const wrap = document.createElement("div");
  wrap.className = "flex flex-col gap-0.5 min-w-0";

  if (f.type === "toggle") {
    wrap.className = "flex items-center justify-between gap-2 py-1 min-w-0";
    const lbl = document.createElement("label");
    lbl.htmlFor = `p-${f.name}`;
    lbl.className = LABEL_CLS + " cursor-pointer truncate";
    lbl.textContent = f.label;
    const input = document.createElement("input");
    input.type = "checkbox";
    input.id = `p-${f.name}`;
    input.checked = f.default === "1";
    input.className = "w-4 h-4 accent-blue-600 cursor-pointer shrink-0 rounded";
    wrap.append(lbl, input);
    return wrap;
  }

  const lbl = document.createElement("label");
  lbl.htmlFor = `p-${f.name}`;
  lbl.className = LABEL_CLS;
  lbl.textContent = f.label;
  wrap.appendChild(lbl);

  let input;
  if (f.type === "select") {
    input = document.createElement("select");
    input.id = `p-${f.name}`;
    for (const v of f.values) {
      const o = document.createElement("option");
      o.value = v; o.textContent = v || "(none)";
      if (v === f.default) o.selected = true;
      input.appendChild(o);
    }
  } else {
    input = document.createElement("input");
    input.type = f.type === "number" ? "number" : f.type === "date" ? "date" : "text";
    input.id = `p-${f.name}`;
    input.value = f.default ?? "";
    if (f.min !== undefined) input.min = f.min;
    if (f.max !== undefined) input.max = f.max;
  }
  input.className = INPUT_CLS;
  wrap.appendChild(input);

  if (f.hint) {
    const hint = document.createElement("div");
    hint.className = HINT_CLS;
    hint.textContent = f.hint;
    wrap.appendChild(hint);
  }
  return wrap;
}

function rebuildForm() {
  form.innerHTML = "";
  const ep = getEndpointCfg();
  if (!ep.sections || ep.sections.length === 0) {
    const msg = document.createElement("div");
    msg.className = "text-[11px] text-gray-700 dark:text-neutral-500 italic py-6 text-center";
    msg.innerHTML = '<i class="fa-solid fa-circle-info mr-1"></i> No parameters — just hit Run.';
    form.appendChild(msg);
    updatePreview();
    return;
  }
  for (const section of ep.sections) {
    const sec = document.createElement("div");
    sec.className = "space-y-1.5";
    const h = document.createElement("div");
    h.className = "text-[10px] uppercase tracking-wider font-semibold text-gray-700 dark:text-neutral-400 border-b border-gray-200 dark:border-neutral-800 pb-1";
    h.textContent = section.title;
    sec.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "grid grid-cols-1 sm:grid-cols-2 gap-1.5";
    for (const f of section.fields) grid.appendChild(buildField(f));
    sec.appendChild(grid);
    form.appendChild(sec);
  }
  updatePreview();
}

function collectParams() {
  const ep = getEndpointCfg();
  const skipName = ep.pathField;
  const params = new URLSearchParams();
  for (const section of ep.sections || []) {
    for (const f of section.fields) {
      if (f.name === skipName) continue;
      const node = document.getElementById(`p-${f.name}`);
      if (!node) continue;
      const val = f.type === "toggle"
        ? (node.checked ? "1" : "0")
        : String(node.value ?? "").trim();
      if (val === "") continue;
      if (String(f.default ?? "") === val) continue;
      params.set(f.name, val);
    }
  }
  return params;
}

function buildUrl() {
  const ep = getEndpointCfg();
  let base = ep.base;
  if (ep.pathField) {
    const node = document.getElementById(`p-${ep.pathField}`);
    const val = node ? String(node.value ?? "").trim() : "";
    if (val) base += "/" + encodeURIComponent(val);
  }
  const qs = collectParams().toString();
  return qs ? `${base}?${qs}` : base;
}

function updatePreview() {
  urlPreview.textContent = buildUrl();
}

function resetForm() {
  const ep = getEndpointCfg();
  for (const section of ep.sections || []) for (const f of section.fields) {
    const node = document.getElementById(`p-${f.name}`);
    if (!node) continue;
    if (f.type === "toggle") node.checked = f.default === "1";
    else node.value = f.default ?? "";
  }
  updatePreview();
  resetResponse();
}

function resetResponse() {
  statusEl.textContent = "—";
  statusEl.className = "font-semibold text-gray-700 dark:text-neutral-400";
  timeEl.innerHTML = '<i class="fa-regular fa-clock mr-1 text-[10px]"></i>—';
  sizeEl.innerHTML = '<i class="fa-solid fa-database mr-1 text-[10px]"></i>—';
  cacheEl.innerHTML = '<i class="fa-solid fa-bolt mr-1 text-[10px]"></i>—';
  responseEl.textContent = "Run a query to see the response.";
}

async function run() {
  const url = buildUrl();
  runBtn.disabled = true;
  statusEl.textContent = "loading…";
  statusEl.className = "font-semibold text-blue-600 dark:text-blue-400";
  timeEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1 text-[10px]"></i>—';
  sizeEl.innerHTML = '<i class="fa-solid fa-database mr-1 text-[10px]"></i>—';
  cacheEl.innerHTML = '<i class="fa-solid fa-bolt mr-1 text-[10px]"></i>—';
  responseEl.textContent = "";
  const t0 = performance.now();
  try {
    const res  = await fetch(url, { headers: { Accept: "*/*" } });
    const ms   = Math.round(performance.now() - t0);
    const text = await res.text();
    timeEl.innerHTML  = `<i class="fa-regular fa-clock mr-1 text-[10px]"></i>${ms} ms`;
    sizeEl.innerHTML  = `<i class="fa-solid fa-database mr-1 text-[10px]"></i>${(new Blob([text]).size / 1024).toFixed(1)} KB`;
    const cacheVal = res.headers.get("X-Cache") || "—";
    const cacheIcon = cacheVal.startsWith("HIT") ? "fa-bolt text-amber-500" : "fa-cloud-arrow-down text-blue-500";
    cacheEl.innerHTML = `<i class="fa-solid ${cacheIcon} mr-1 text-[10px]"></i>${cacheVal}`;
    statusEl.textContent = `${res.status} ${res.statusText || ""}`.trim();
    statusEl.className = "font-semibold " + (res.ok ? "text-emerald-600 dark:text-emerald-400" : "text-red-600 dark:text-red-400");
    if (/json/i.test(res.headers.get("content-type") || "")) {
      try { responseEl.textContent = JSON.stringify(JSON.parse(text), null, 2); }
      catch { responseEl.textContent = text; }
    } else {
      responseEl.textContent = text;
    }
  } catch (e) {
    statusEl.textContent = "network error";
    statusEl.className = "font-semibold text-red-600 dark:text-red-400";
    responseEl.textContent = String(e);
  } finally {
    runBtn.disabled = false;
  }
}

function selectApi(apiKey) {
  const cfg = APIS[apiKey];
  if (!cfg || !cfg.configured) return;
  currentApi = apiKey;
  currentEndpoint = cfg.endpoints[0].id;
  populateEndpointSelect();
  rebuildForm();
  resetResponse();
}

function selectEndpoint(epId) {
  const cfg = getApiCfg();
  const ep = (cfg.endpoints || []).find(e => e.id === epId);
  if (!ep) return;
  currentEndpoint = ep.id;
  rebuildForm();
  resetResponse();
}

/* Theme toggle */
const THEME_KEY = "apilayer-theme";
const themeBtn  = document.getElementById("themeToggle");
const metaColor = document.getElementById("themeColorMeta");

function applyTheme(theme, persist) {
  const isDark = theme === "dark";
  document.documentElement.classList.toggle("dark", isDark);
  document.documentElement.dataset.theme = theme;
  themeBtn.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
  themeBtn.setAttribute("title",      isDark ? "Switch to light mode" : "Switch to dark mode");
  if (metaColor) metaColor.content = isDark ? "#171717" : "#ffffff";
  if (persist) localStorage.setItem(THEME_KEY, theme);
}

themeBtn.addEventListener("click", () => {
  const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
  applyTheme(next, true);
});

applyTheme(document.documentElement.classList.contains("dark") ? "dark" : "light", false);

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
  if (!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? "dark" : "light", false);
});

/* Wiring */
apiSelect.addEventListener("change",      () => selectApi(apiSelect.value));
endpointSelect.addEventListener("change", () => selectEndpoint(endpointSelect.value));
form.addEventListener("input",  updatePreview);
form.addEventListener("change", updatePreview);
runBtn.addEventListener("click", run);
resetBtn.addEventListener("click", resetForm);

populateApiSelect();
populateEndpointSelect();
rebuildForm();
resetResponse();
</script>
</body>
</html>
